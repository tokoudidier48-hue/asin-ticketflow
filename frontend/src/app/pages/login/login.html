<div class="login-container">
  <div class="login-card">
    <h1>ASIN TicketFlow</h1>
    <p class="subtitle">Gestion des tickets de maintenance</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Adresse email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Votre email"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
        />
      </div>

      @if (error) {
        <div class="error">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading"
      >
        @if (loading) {
          Connexion...
        } @else {
          Se connecter
        }
      </button>

    </form>
  </div>
</div>
